name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q payload tools tests
      - name: Test backup and session handling
        run: python -m unittest discover -s tests -v
      - name: Check compatibility with pinned upstream menu source
        run: python tools/check_upstream.py
      - name: Audit tracked publication files
        run: python tools/audit_publication.py
