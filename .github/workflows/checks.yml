name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  texture-lifetime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and exercise native texture lifecycle regression
        run: python tools/check_texture_lifetime.py
      - name: Exercise Mii queue ownership and batch review buffers
        run: python tools/check_mii_queue_types.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded UGC decompression dependency
        run: python -m pip install zstandard==0.25.0
      - name: Compile Python source
        run: python -m compileall -q payload tools tests
      - name: Test backups, sessions, save transfers and translations
        run: python -m unittest discover -s tests -v
      - name: Check compatibility with pinned upstream menu and renderer source
        run: python tools/check_upstream.py
      - name: Exercise all seven UGC categories with the verified original codec
        run: python tools/check_ugc_codec.py
      - name: Audit tracked publication files
        run: python tools/audit_publication.py
      - name: Build Windows setup
        run: python tools/build_setup.py --out "$env:RUNNER_TEMP\setup-output"
      - name: Test setup bundle and render its own interface
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'setup-output\Tomodachi-Life-Native-ShareMii-Setup.exe'
          $qa = Join-Path $env:RUNNER_TEMP 'setup-qa'
          $image = Join-Path $env:RUNNER_TEMP 'setup-output\setup-preview.png'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test','--work-dir',$qa,'--snapshot',$image) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { Stop-Process -Id $process.Id; throw 'Setup self-test timed out' }
          Get-Content -LiteralPath (Join-Path $qa 'self-test.txt')
          if ($process.ExitCode -ne 0) { throw 'Setup self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Setup
          path: |
            ${{ runner.temp }}/setup-output/Tomodachi-Life-Native-ShareMii-Setup.exe
            ${{ runner.temp }}/setup-output/Tomodachi-Life-Native-ShareMii-Setup.exe.sha256
            ${{ runner.temp }}/setup-output/setup-preview.png
